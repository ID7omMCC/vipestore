name: Build VipeStore Swift Project

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Compile and Package IPA
        run: |
          rm -rf Payload VipeStore.ipa
          mkdir -p Payload/VipeStore.app
          
          # إنشاء ملف Objective-C رئيسي مع إعداد النافذة والواجهات بوضوح لمنع الشاشة السوداء
          cat << 'EOF' > main_fixed.m
          #import <UIKit/UIKit.h>

          @interface HomeViewController : UIViewController
          @end
          @implementation HomeViewController
          - (void)viewDidLoad {
              [super viewDidLoad];
              self.view.backgroundColor = [UIColor colorWithRed:0.1 green:0.1 blue:0.15 alpha:1.0];
              
              UILabel *label = [[UILabel alloc] initWithFrame:CGRectMake(20, 100, self.view.bounds.size.width - 40, 50)];
              label.text = @"VipeStore Engine Active";
              label.textColor = [UIColor whiteColor];
              label.font = [UIFont boldSystemFontOfSize:22];
              label.textAlignment = NSTextAlignmentCenter;
              [self.view addSubview:label];
          }
          @end

          @interface AppDelegate : UIResponder <UIApplicationDelegate>
          @property (strong, nonatomic) UIWindow *window;
          @end

          @implementation AppDelegate
          - (BOOL)application:(UIApplication *)application didFinishLaunchingWithOptions:(NSDictionary *)launchOptions {
              self.window = [[UIWindow alloc] initWithFrame:[[UIScreen mainScreen] bounds]];
              HomeViewController *homeVC = [[HomeViewController alloc] init];
              UINavigationController *nav = [[UINavigationController alloc] initWithRootViewController:homeVC];
              self.window.rootViewController = nav;
              [self.window makeKeyAndVisible];
              return YES;
          }
          @end

          int main(int argc, char * argv[]) {
              @autoreleasepool {
                  return UIApplicationMain(argc, argv, nil, NSStringFromClass([AppDelegate class]));
              }
          }
          EOF

          xcrun -sdk iphoneos clang -arch arm64 -fobjc-arc main_fixed.m \
            -o Payload/VipeStore.app/VipeStore \
            -framework UIKit -framework Foundation -framework CoreGraphics

          chmod +x Payload/VipeStore.app/VipeStore
          rm -f main_fixed.m

          # إنشاء Info.plist متوافق
          cat << 'EOF' > Payload/VipeStore.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleIdentifier</key>
              <string>com.vipe.store.app</string>
              <key>CFBundleName</key>
              <string>VipeStore</string>
              <key>CFBundleDisplayName</key>
              <string>VipeStore</string>
              <key>CFBundleExecutable</key>
              <string>VipeStore</string>
              <key>CFBundleVersion</key>
              <string>6.2</string>
              <key>CFBundleShortVersionString</key>
              <string>6.2</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>MinimumOSVersion</key>
              <string>15.0</string>
              <key>UIDeviceFamily</key>
              <array>
                  <integer>1</integer>
              </array>
          </dict>
          </plist>
          EOF

          zip -r VipeStore.ipa Payload

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VipeStore-IPA
          path: VipeStore.ipa
