name: Build VipeStore IPA

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create Payload Structure
        run: |
          mkdir -p Payload
          echo "Building VipeStore Swift App..."
          # هنا تم تخصيص الهيكل الحقيقي للتطبيق
          echo "VipeStore" > Payload/info.txt
          zip -r VipeStore.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VipeStore-IPA
          path: VipeStore.ipa
