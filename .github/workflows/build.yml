name: Build VipeStore Swift Project

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Prepare and Package IPA
        run: |
          rm -rf Payload VipeStore.ipa
          mkdir -p Payload/VipeStore.app
          
          # نقل ملفات المشروع أو ملفات السويفت المتوفرة للمجلد مباشرة
          if [ -d "Sources/VipeStore" ]; then
              cp -R Sources/VipeStore/* Payload/VipeStore.app/ || true
          fi

          # التأكد من وجود Info.plist الأساسي ليعمل التطبيق
          cat << 'EOF' > Payload/VipeStore.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleIdentifier</key>
              <string>com.vipe.store.app</string>
              <key>CFBundleName</key>
              <string>VipeStore</string>
              <key>CFBundleDisplayName</key>
              <string>VipeStore</string>
              <key>CFBundleExecutable</key>
              <string>VipeStore</string>
              <key>CFBundleVersion</key>
              <string>6.0</string>
              <key>CFBundleShortVersionString</key>
              <string>6.0</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>MinimumOSVersion</key>
              <string>15.0</string>
              <key>UIDeviceFamily</key>
              <array>
                  <integer>1</integer>
              </array>
          </dict>
          </plist>
          EOF

          zip -r VipeStore.ipa Payload

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VipeStore-IPA
          path: VipeStore.ipa
