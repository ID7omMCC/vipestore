name: Build Standalone VipeStore App

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Native Standalone App
        run: |
          mkdir -p Payload/VipeStore.app

          cat << 'EOF' > main.m
          #import <UIKit/UIKit.h>

          // --- Home View Controller ---
          @interface HomeViewController : UIViewController
          @end
          @implementation HomeViewController
          - (void)viewDidLoad {
              [super viewDidLoad];
              self.view.backgroundColor = [UIColor colorWithRed:0.07 green:0.07 blue:0.09 alpha:1.0];
              
              UILabel *label = [[UILabel alloc] initWithFrame:CGRectMake(20, 70, self.view.frame.size.width - 40, 40)];
              label.text = @"Explore Apps";
              label.textColor = [UIColor whiteColor];
              label.font = [UIFont boldSystemFontOfSize:30];
              [self.view addSubview:label];
              
              UIView *card = [[UIView alloc] initWithFrame:CGRectMake(20, 130, self.view.frame.size.width - 40, 130)];
              card.backgroundColor = [UIColor colorWithRed:0.15 green:0.12 blue:0.25 alpha:1.0];
              card.layer.cornerRadius = 16;
              [self.view addSubview:card];
              
              UILabel *cardTitle = [[UILabel alloc] initWithFrame:CGRectMake(15, 20, card.frame.size.width - 30, 30)];
              cardTitle.text = @"VipeStore Repository";
              cardTitle.textColor = [UIColor whiteColor];
              cardTitle.font = [UIFont boldSystemFontOfSize:20];
              [card addSubview:cardTitle];
              
              UILabel *cardSub = [[UILabel alloc] initWithFrame:CGRectMake(15, 55, card.frame.size.width - 30, 30)];
              cardSub.text = @"Ready to sideload apps seamlessly.";
              cardSub.textColor = [UIColor lightGrayColor];
              cardSub.font = [UIFont systemFontOfSize:14];
              [card addSubview:cardSub];
          }
          @end

          // --- My Apps View Controller (New) ---
          @interface MyAppsViewController : UIViewController <UITableViewDataSource, UITableViewDelegate>
          @property (strong, nonatomic) UITableView *tableView;
          @property (strong, nonatomic) NSMutableArray *appsList;
          @end
          @implementation MyAppsViewController
          - (void)viewDidLoad {
              [super viewDidLoad];
              self.view.backgroundColor = [UIColor colorWithRed:0.07 green:0.07 blue:0.09 alpha:1.0];
              
              UILabel *label = [[UILabel alloc] initWithFrame:CGRectMake(20, 70, self.view.frame.size.width - 40, 40)];
              label.text = @"My Apps";
              label.textColor = [UIColor whiteColor];
              label.font = [UIFont boldSystemFontOfSize:30];
              [self.view addSubview:label];
              
              self.appsList = [NSMutableArray arrayWithArray:@[
                  @{@"name": @"VipeStore Client", @"version": @"v2.0", @"status": @"Active"},
                  @{@"name": @"Mock App Example", @"version": @"v1.1", @"status": @"Active"}
              ]];
              
              self.tableView = [[UITableView alloc] initWithFrame:CGRectMake(0, 130, self.view.frame.size.width, self.view.frame.size.height - 200) style:UITableViewStyleInsetGrouped];
              self.tableView.backgroundColor = [UIColor clearColor];
              self.tableView.dataSource = self;
              self.tableView.delegate = self;
              [self.view addSubview:self.tableView];
          }

          - (NSInteger)tableView:(UITableView *)tableView numberOfRowsInSection:(NSInteger)section {
              return self.appsList.count;
          }

          - (UITableViewCell *)tableView:(UITableView *)tableView cellForRowAtIndexPath:(NSIndexPath *)indexPath {
              UITableViewCell *cell = [tableView dequeueReusableCellWithIdentifier:@"AppCell"];
              if (!cell) {
                  cell = [[UITableViewCell alloc] initWithStyle:UITableViewCellStyleSubtitle reuseIdentifier:@"AppCell"];
              }
              NSDictionary *app = self.appsList[indexPath.row];
              cell.textLabel.text = app[@"name"];
              cell.textLabel.textColor = [UIColor whiteColor];
              cell.detailTextLabel.text = [NSString stringWithFormat:@"%@ • %@", app[@"version"], app[@"status"]];
              cell.detailTextLabel.textColor = [UIColor grayColor];
              cell.backgroundColor = [UIColor colorWithRed:0.12 green:0.12 blue:0.15 alpha:1.0];
              cell.accessoryType = UITableViewCellAccessoryDisclosureIndicator;
              return cell;
          }

          - (UISwipeActionsConfiguration *)tableView:(UITableView *)tableView trailingSwipeActionsConfigurationForRowAtIndexPath:(NSIndexPath *)indexPath {
              UIContextualAction *deleteAction = [UIContextualAction contextualActionWithStyle:UIContextualActionStyleDestructive title:@"Delete" handler:^(UIContextualAction * _Nonnull action, __kindof UIView * _Nonnull sourceView, void (^ _Nonnull completionHandler)(BOOL)) {
                  [self.appsList removeObjectAtIndex:indexPath.row];
                  [tableView deleteRowsAtIndexPaths:@[indexPath] withRowAnimation:UITableViewRowAnimationAutomatic];
                  completionHandler(YES);
              }];
              
              UIContextualAction *disableAction = [UIContextualAction contextualActionWithStyle:UIContextualActionStyleNormal title:@"Disable" handler:^(UIContextualAction * _Nonnull action, __kindof UIView * _Nonnull sourceView, void (^ _Nonnull completionHandler)(BOOL)) {
                  NSMutableDictionary *app = [self.appsList[indexPath.row] mutableCopy];
                  app[@"status"] = [app[@"status"] isEqualToString:@"Disabled"] ? @"Active" : @"Disabled";
                  self.appsList[indexPath.row] = app;
                  [tableView reloadRowsAtIndexPaths:@[indexPath] withRowAnimation:UITableViewRowAnimationAutomatic];
                  completionHandler(YES);
              }];
              disableAction.backgroundColor = [UIColor systemOrangeColor];
              
              return [UISwipeActionsConfiguration configurationWithActions:@[deleteAction, disableAction]];
          }
          @end

          // --- Sources View Controller ---
          @interface SourcesViewController : UIViewController
          @end
          @implementation SourcesViewController
          - (void)viewDidLoad {
              [super viewDidLoad];
              self.view.backgroundColor = [UIColor colorWithRed:0.07 green:0.07 blue:0.09 alpha:1.0];
              
              UILabel *label = [[UILabel alloc] initWithFrame:CGRectMake(20, 70, self.view.frame.size.width - 40, 40)];
              label.text = @"Sources";
              label.textColor = [UIColor whiteColor];
              label.font = [UIFont boldSystemFontOfSize:30];
              [self.view addSubview:label];
          }
          @end

          // --- Account View Controller (Apple ID Login) ---
          @interface AccountViewController : UIViewController <UITextFieldDelegate>
          @property (strong, nonatomic) UITextField *emailField;
          @property (strong, nonatomic) UITextField *passwordField;
          @end
          @implementation AccountViewController
          - (void)viewDidLoad {
              [super viewDidLoad];
              self.view.backgroundColor = [UIColor colorWithRed:0.07 green:0.07 blue:0.09 alpha:1.0];
              
              UILabel *label = [[UILabel alloc] initWithFrame:CGRectMake(20, 70, self.view.frame.size.width - 40, 40)];
              label.text = @"Apple ID Account";
              label.textColor = [UIColor whiteColor];
              label.font = [UIFont boldSystemFontOfSize:30];
              [self.view addSubview:label];
              
              UILabel *subLabel = [[UILabel alloc] initWithFrame:CGRectMake(20, 115, self.view.frame.size.width - 40, 30)];
              subLabel.text = @"Sign in to sideload and sign apps locally.";
              subLabel.textColor = [UIColor grayColor];
              subLabel.font = [UIFont systemFontOfSize:14];
              [self.view addSubview:subLabel];
              
              // Email Field
              self.emailField = [[UITextField alloc] initWithFrame:CGRectMake(20, 170, self.view.frame.size.width - 40, 50)];
              self.emailField.placeholder = @"Apple ID Email";
              self.emailField.backgroundColor = [UIColor colorWithRed:0.12 green:0.12 blue:0.15 alpha:1.0];
              self.emailField.textColor = [UIColor whiteColor];
              self.emailField.layer.cornerRadius = 12;
              self.emailField.leftView = [[UIView alloc] initWithFrame:CGRectMake(0, 0, 15, 50)];
              self.emailField.leftViewMode = UITextFieldViewModeAlways;
              [self.view addSubview:self.emailField];
              
              // Password Field
              self.passwordField = [[UITextField alloc] initWithFrame:CGRectMake(20, 235, self.view.frame.size.width - 40, 50)];
              self.passwordField.placeholder = @"Password / App-Specific Password";
              self.passwordField.backgroundColor = [UIColor colorWithRed:0.12 green:0.12 blue:0.15 alpha:1.0];
              self.passwordField.textColor = [UIColor whiteColor];
              self.passwordField.secureTextEntry = YES;
              self.passwordField.layer.cornerRadius = 12;
              self.passwordField.leftView = [[UIView alloc] initWithFrame:CGRectMake(0, 0, 15, 50)];
              self.passwordField.leftViewMode = UITextFieldViewModeAlways;
              [self.view addSubview:self.passwordField];
              
              // Sign In Button
              UIButton *loginBtn = [UIButton buttonWithType:UIButtonTypeSystem];
              loginBtn.frame = CGRectMake(20, 310, self.view.frame.size.width - 40, 50);
              loginBtn.backgroundColor = [UIColor systemPurpleColor];
              [loginBtn setTitle:@"Sign In" forState:UIControlStateNormal];
              [loginBtn setTitleColor:[UIColor whiteColor] forState:UIControlStateNormal];
              loginBtn.titleLabel.font = [UIFont boldSystemFontOfSize:17];
              loginBtn.layer.cornerRadius = 12;
              [loginBtn addTarget:self action:@selector(handleLogin) forControlEvents:UIControlEventTouchUpInside];
              [self.view addSubview:loginBtn];
          }

          - (void)handleLogin {
              [self.view endEditing:YES];
              UIAlertController *alert = [UIAlertController alertControllerWithTitle:@"Authentication" message:@"Apple ID linked successfully!" preferredStyle:UIAlertControllerStyleAlert];
              [alert addAction:[UIAlertAction actionWithTitle:@"OK" style:UIAlertActionStyleDefault handler:nil]];
              [self presentViewController:alert animated:YES completion:nil];
          }
          @end

          // --- Settings View Controller ---
          @interface SettingsViewController : UIViewController
          @end
          @implementation SettingsViewController
          - (void)viewDidLoad {
              [super viewDidLoad];
              self.view.backgroundColor = [UIColor colorWithRed:0.07 green:0.07 blue:0.09 alpha:1.0];
              
              UILabel *label = [[UILabel alloc] initWithFrame:CGRectMake(20, 70, self.view.frame.size.width - 40, 40)];
              label.text = @"Settings";
              label.textColor = [UIColor whiteColor];
              label.font = [UIFont boldSystemFontOfSize:30];
              [self.view addSubview:label];
          }
          @end

          // --- App Delegate ---
          @interface AppDelegate : UIResponder <UIApplicationDelegate>
          @property (strong, nonatomic) UIWindow *window;
          @end

          @implementation AppDelegate
          - (BOOL)application:(UIApplication *)application didFinishLaunchingWithOptions:(NSDictionary *)launchOptions {
              self.window = [[UIWindow alloc] initWithFrame:[[UIScreen mainScreen] bounds]];
              
              UITabBarController *tabBarController = [[UITabBarController alloc] init];
              
              HomeViewController *homeVC = [[HomeViewController alloc] init];
              homeVC.tabBarItem = [[UITabBarItem alloc] initWithTitle:@"Home" image:[UIImage systemImageNamed:@"house.fill"] tag:0];
              
              MyAppsViewController *myAppsVC = [[MyAppsViewController alloc] init];
              myAppsVC.tabBarItem = [[UITabBarItem alloc] initWithTitle:@"My Apps" image:[UIImage systemImageNamed:@"square.stack.fill"] tag:1];
              
              SourcesViewController *sourcesVC = [[SourcesViewController alloc] init];
              sourcesVC.tabBarItem = [[UITabBarItem alloc] initWithTitle:@"Sources" image:[UIImage systemImageNamed:@"globe"] tag:2];
              
              AccountViewController *accountVC = [[AccountViewController alloc] init];
              accountVC.tabBarItem = [[UITabBarItem alloc] initWithTitle:@"Account" image:[UIImage systemImageNamed:@"person.crop.circle.fill"] tag:3];
              
              SettingsViewController *settingsVC = [[SettingsViewController alloc] init];
              settingsVC.tabBarItem = [[UITabBarItem alloc] initWithTitle:@"Settings" image:[UIImage systemImageNamed:@"gearshape.fill"] tag:4];
              
              tabBarController.viewControllers = @[homeVC, myAppsVC, sourcesVC, accountVC, settingsVC];
              tabBarController.tabBar.tintColor = [UIColor systemPurpleColor];
              tabBarController.tabBar.unselectedItemTintColor = [UIColor grayColor];
              
              self.window.rootViewController = tabBarController;
              [self.window makeKeyAndVisible];
              return YES;
          }
          @end

          int main(int argc, char * argv[]) {
              @autoreleasepool {
                  return UIApplicationMain(argc, argv, nil, NSStringFromClass([AppDelegate class]));
              }
          }
          EOF

          xcrun -sdk iphoneos clang -arch arm64 -fobjc-arc main.m \
            -o Payload/VipeStore.app/VipeStore \
            -framework UIKit -framework Foundation -framework CoreGraphics

          chmod +x Payload/VipeStore.app/VipeStore

      - name: Create Info.plist & App Resources
        run: |
          cat << 'EOF' > Payload/VipeStore.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleIdentifier</key>
              <string>com.vipe.store.app</string>
              <key>CFBundleName</key>
              <string>VipeStore</string>
              <key>CFBundleDisplayName</key>
              <string>VipeStore</string>
              <key>CFBundleExecutable</key>
              <string>VipeStore</string>
              <key>CFBundleVersion</key>
              <string>2.5</string>
              <key>CFBundleShortVersionString</key>
              <string>2.5</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>MinimumOSVersion</key>
              <string>15.0</string>
              <key>UIDeviceFamily</key>
              <array>
                  <integer>1</integer>
              </array>
              <key>UIRequiredDeviceCapabilities</key>
              <array>
                  <string>arm64</string>
              </array>
              <key>DTPlatformName</key>
              <string>iphoneos</string>
              <key>DTSDKName</key>
              <string>iphoneos</string>
          </dict>
          </plist>
          EOF

      - name: Package Final IPA
        run: |
          zip -r VipeStore.ipa Payload

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VipeStore-IPA
          path: VipeStore.ipa
