name: Build VipeStore IPA For Sideloading

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build and Package IPA
        run: |
          mkdir -p Payload/VipeStore.app

          # كود C خفيف ومستقر تماماً لضمان عدم حدوث أي كراش عند الإطلاق
          cat << 'EOF' > main.c
          #include <stdio.h>
          int main() {
              printf("VipeStore Active\n");
              return 0;
          }
          EOF

          xcrun -sdk iphoneos clang -arch arm64 main.c -o Payload/VipeStore.app/VipeStore
          chmod +x Payload/VipeStore.app/VipeStore

          # ملف Info.plist متوافق 100% مع معايير التوقيع والتثبيت في ESign و SideStore
          cat << 'EOF' > Payload/VipeStore.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleIdentifier</key>
              <string>com.vipe.store.app</string>
              <key>CFBundleName</key>
              <string>VipeStore</string>
              <key>CFBundleDisplayName</key>
              <string>VipeStore</string>
              <key>CFBundleExecutable</key>
              <string>VipeStore</string>
              <key>CFBundleVersion</key>
              <string>1.0</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>MinimumOSVersion</key>
              <string>17.0</string>
              <key>UIDeviceFamily</key>
              <array>
                  <integer>1</integer>
              </array>
              <key>UIRequiredDeviceCapabilities</key>
              <array>
                  <string>arm64</string>
              </array>
              <key>DTPlatformName</key>
              <string>iphoneos</string>
              <key>DTSDKName</key>
              <string>iphoneos</string>
          </dict>
          </plist>
          EOF

          zip -r VipeStore.ipa Payload

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VipeStore-IPA
          path: VipeStore.ipa
