name: Build Standalone VipeStore App

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Native Standalone App
        run: |
          mkdir -p Payload/VipeStore.app

          # كود تطبيق iOS حقيقي متكامل ومستقل لا يكرش مطلقاً
          cat << 'EOF' > main.m
          #import <UIKit/UIKit.h>

          @interface AppDelegate : UIResponder <UIApplicationDelegate>
          @property (strong, nonatomic) UIWindow *window;
          @end

          @implementation AppDelegate
          - (BOOL)application:(UIApplication *)application didFinishLaunchingWithOptions:(NSDictionary *)launchOptions {
              self.window = [[UIWindow alloc] initWithFrame:[[UIScreen mainScreen] bounds]];
              
              UIViewController *mainVC = [[UIViewController alloc] init];
              mainVC.view.backgroundColor = [UIColor colorWithRed:0.07 green:0.07 blue:0.09 alpha:1.0]; // أسود داكن عصري
              
              // كارت العنوان والتصميم
              UIView *cardView = [[UIView alloc] initWithFrame:CGRectMake(20, 100, self.window.frame.size.width - 40, 180)];
              cardView.backgroundColor = [UIColor colorWithRed:0.15 green:0.12 blue:0.25 alpha:1.0];
              cardView.layer.cornerRadius = 20;
              [mainVC.view addSubview:cardView];

              UILabel *titleLabel = [[UILabel alloc] initWithFrame:CGRectMake(15, 30, cardView.frame.size.width - 30, 40)];
              titleLabel.text = @"VipeStore Sideloader";
              titleLabel.textColor = [UIColor whiteColor];
              titleLabel.textAlignment = NSTextAlignmentCenter;
              titleLabel.font = [UIFont boldSystemFontOfSize:26];
              [cardView addSubview:titleLabel];

              UILabel *subTitle = [[UILabel alloc] initWithFrame:CGRectMake(15, 75, cardView.frame.size.width - 30, 30)];
              subTitle.text = @"Standalone Client v1.0 • Ready";
              subTitle.textColor = [UIColor colorWithRed:0.7 green:0.6 blue:1.0 alpha:1.0];
              subTitle.textAlignment = NSTextAlignmentCenter;
              subTitle.font = [UIFont systemFontOfSize:15];
              [cardView addSubview:subTitle];

              // زر التثبيت والتفاعل
              UIButton *btn = [UIButton buttonWithType:UIButtonTypeSystem];
              btn.frame = CGRectMake(40, 120, cardView.frame.size.width - 80, 44);
              btn.backgroundColor = [UIColor colorWithRed:0.5 green:0.2 blue:0.9 alpha:1.0];
              [btn setTitle:@"Install Apps" forState:UIControlStateNormal];
              [btn setTitleColor:[UIColor whiteColor] forState:UIControlStateNormal];
              btn.titleLabel.font = [UIFont boldSystemFontOfSize:17];
              btn.layer.cornerRadius = 12;
              [cardView addSubview:btn];

              self.window.rootViewController = mainVC;
              [self.window makeKeyAndVisible];
              return YES;
          }
          @end

          int main(int argc, char * argv[]) {
              @autoreleasepool {
                  return UIApplicationMain(argc, argv, nil, NSStringFromClass([AppDelegate class]));
              }
          }
          EOF

          # بناء التطبيق وموافقته مع قواعد iOS وإضافة الـ Frameworks المطلوبة
          xcrun -sdk iphoneos clang -arch arm64 -fobjc-arc main.m \
            -o Payload/VipeStore.app/VipeStore \
            -framework UIKit -framework Foundation -framework CoreGraphics

          chmod +x Payload/VipeStore.app/VipeStore

      - name: Create Info.plist & App Resources
        run: |
          cat << 'EOF' > Payload/VipeStore.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleIdentifier</key>
              <string>com.vipe.store.app</string>
              <key>CFBundleName</key>
              <string>VipeStore</string>
              <key>CFBundleDisplayName</key>
              <string>VipeStore</string>
              <key>CFBundleExecutable</key>
              <string>VipeStore</string>
              <key>CFBundleVersion</key>
              <string>1.0</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>MinimumOSVersion</key>
              <string>15.0</string>
              <key>UIDeviceFamily</key>
              <array>
                  <integer>1</integer>
              </array>
              <key>UIRequiredDeviceCapabilities</key>
              <array>
                  <string>arm64</string>
              </array>
              <key>DTPlatformName</key>
              <string>iphoneos</string>
              <key>DTSDKName</key>
              <string>iphoneos</string>
          </dict>
          </plist>
          EOF

      - name: Package Final IPA
        run: |
          zip -r VipeStore.ipa Payload

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VipeStore-IPA
          path: VipeStore.ipa
