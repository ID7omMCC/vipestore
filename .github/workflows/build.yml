name: Build Standalone VipeStore App

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Native Standalone App
        run: |
          rm -rf Payload VipeStore.ipa
          mkdir -p Payload/VipeStore.app

          cat << 'EOF' > main.m
          #import <UIKit/UIKit.h>

          // --- Home View Controller ---
          @interface HomeViewController : UIViewController
          @end
          @implementation HomeViewController
          - (void)viewDidLoad {
              [super viewDidLoad];
              self.view.backgroundColor = [UIColor colorWithRed:0.07 green:0.07 blue:0.09 alpha:1.0];
              CGFloat screenWidth = self.view.bounds.size.width;
              
              UILabel *label = [[UILabel alloc] initWithFrame:CGRectMake(20, 70, screenWidth - 40, 40)];
              label.text = @"Explore Apps";
              label.textColor = [UIColor whiteColor];
              label.font = [UIFont boldSystemFontOfSize:30];
              [self.view addSubview:label];
              
              UIView *card = [[UIView alloc] initWithFrame:CGRectMake(20, 130, screenWidth - 40, 140)];
              card.backgroundColor = [UIColor colorWithRed:0.15 green:0.12 blue:0.25 alpha:1.0];
              card.layer.cornerRadius = 16;
              card.autoresizingMask = UIViewAutoresizingFlexibleWidth;
              [self.view addSubview:card];
              
              UILabel *cardTitle = [[UILabel alloc] initWithFrame:CGRectMake(15, 20, card.frame.size.width - 30, 30)];
              cardTitle.text = @"VipeStore Engine v3.1";
              cardTitle.textColor = [UIColor whiteColor];
              cardTitle.font = [UIFont boldSystemFontOfSize:20];
              cardTitle.autoresizingMask = UIViewAutoresizingFlexibleWidth;
              [card addSubview:cardTitle];
              
              UILabel *cardSub = [[UILabel alloc] initWithFrame:CGRectMake(15, 55, card.frame.size.width - 30, 40)];
              cardSub.text = @"Sideload IPA files locally, manage repositories & certs with ease.";
              cardSub.textColor = [UIColor lightGrayColor];
              cardSub.numberOfLines = 2;
              cardSub.font = [UIFont systemFontOfSize:13];
              cardSub.autoresizingMask = UIViewAutoresizingFlexibleWidth;
              [card addSubview:cardSub];
          }
          @end

          // --- My Apps View Controller ---
          @interface MyAppsViewController : UIViewController <UITableViewDataSource, UITableViewDelegate, UIDocumentPickerDelegate>
          @property (strong, nonatomic) UITableView *tableView;
          @property (strong, nonatomic) NSMutableArray *appsList;
          @end
          @implementation MyAppsViewController
          - (void)viewDidLoad {
              [super viewDidLoad];
              self.view.backgroundColor = [UIColor colorWithRed:0.07 green:0.07 blue:0.09 alpha:1.0];
              CGFloat screenWidth = self.view.bounds.size.width;
              CGFloat screenHeight = self.view.bounds.size.height;
              
              UILabel *label = [[UILabel alloc] initWithFrame:CGRectMake(20, 70, screenWidth - 100, 40)];
              label.text = @"My Apps";
              label.textColor = [UIColor whiteColor];
              label.font = [UIFont boldSystemFontOfSize:30];
              [self.view addSubview:label];
              
              UIButton *addBtn = [UIButton buttonWithType:UIButtonTypeSystem];
              addBtn.frame = CGRectMake(screenWidth - 60, 70, 40, 40);
              [addBtn setTitle:@"+" forState:UIControlStateNormal];
              [addBtn setTitleColor:[UIColor whiteColor] forState:UIControlStateNormal];
              addBtn.titleLabel.font = [UIFont boldSystemFontOfSize:28];
              addBtn.backgroundColor = [UIColor systemPurpleColor];
              addBtn.layer.cornerRadius = 20;
              [addBtn addTarget:self action:@selector(importIPA) forControlEvents:UIControlEventTouchUpInside];
              [self.view addSubview:addBtn];
              
              self.appsList = [NSMutableArray arrayWithArray:@[
                  @{@"name": @"VipeStore Client", @"version": @"v3.1", @"status": @"Active"},
                  @{@"name": @"Custom Sideload App", @"version": @"v1.0", @"status": @"Active"}
              ]];
              
              self.tableView = [[UITableView alloc] initWithFrame:CGRectMake(0, 130, screenWidth, screenHeight - 200) style:UITableViewStyleInsetGrouped];
              self.tableView.backgroundColor = [UIColor clearColor];
              self.tableView.dataSource = self;
              self.tableView.delegate = self;
              self.tableView.autoresizingMask = UIViewAutoresizingFlexibleWidth | UIViewAutoresizingFlexibleHeight;
              [self.view addSubview:self.tableView];
          }

          - (void)importIPA {
              UIDocumentPickerViewController *documentPicker = [[UIDocumentPickerViewController alloc] initWithDocumentTypes:@[@"public.item"] inMode:UIDocumentPickerModeImport];
              documentPicker.delegate = self;
              [self presentViewController:documentPicker animated:YES completion:nil];
          }

          - (void)documentPicker:(UIDocumentPickerViewController *)controller didPickDocumentsAtURLs:(NSArray<NSURL *> *)urls {
              if (urls.firstObject) {
                  NSString *fileName = [urls.firstObject lastPathComponent];
                  [self.appsList addObject:@{@"name": fileName, @"version": @"v1.0", @"status": @"Active"}];
                  [self.tableView reloadData];
              }
          }

          - (NSInteger)tableView:(UITableView *)tableView numberOfRowsInSection:(NSInteger)section {
              return self.appsList.count;
          }

          - (UITableViewCell *)tableView:(UITableView *)tableView cellForRowAtIndexPath:(NSIndexPath *)indexPath {
              UITableViewCell *cell = [tableView dequeueReusableCellWithIdentifier:@"AppCell"];
              if (!cell) {
                  cell = [[UITableViewCell alloc] initWithStyle:UITableViewCellStyleSubtitle reuseIdentifier:@"AppCell"];
              }
              NSDictionary *app = self.appsList[indexPath.row];
              cell.textLabel.text = app[@"name"];
              cell.textLabel.textColor = [UIColor whiteColor];
              cell.detailTextLabel.text = [NSString stringWithFormat:@"%@ • %@", app[@"version"], app[@"status"]];
              cell.detailTextLabel.textColor = [UIColor grayColor];
              cell.backgroundColor = [UIColor colorWithRed:0.12 green:0.12 blue:0.15 alpha:1.0];
              cell.accessoryType = UITableViewCellAccessoryDisclosureIndicator;
              return cell;
          }

          - (UISwipeActionsConfiguration *)tableView:(UITableView *)tableView trailingSwipeActionsConfigurationForRowAtIndexPath:(NSIndexPath *)indexPath {
              UIContextualAction *deleteAction = [UIContextualAction contextualActionWithStyle:UIContextualActionStyleDestructive title:@"Delete" handler:^(UIContextualAction * _Nonnull action, __kindof UIView * _Nonnull sourceView, void (^ _Nonnull completionHandler)(BOOL)) {
                  [self.appsList removeObjectAtIndex:indexPath.row];
                  [tableView deleteRowsAtIndexPaths:@[indexPath] withRowAnimation:UITableViewRowAnimationAutomatic];
                  completionHandler(YES);
              }];
              
              UIContextualAction *disableAction = [UIContextualAction contextualActionWithStyle:UIContextualActionStyleNormal title:@"Disable" handler:^(UIContextualAction * _Nonnull action, __kindof UIView * _Nonnull sourceView, void (^ _Nonnull completionHandler)(BOOL)) {
                  NSMutableDictionary *app = [self.appsList[indexPath.row] mutableCopy];
                  app[@"status"] = [app[@"status"] isEqualToString:@"Disabled"] ? @"Active" : @"Disabled";
                  self.appsList[indexPath.row] = app;
                  [tableView reloadRowsAtIndexPaths:@[indexPath] withRowAnimation:UITableViewRowAnimationAutomatic];
                  completionHandler(YES);
              }];
              disableAction.backgroundColor = [UIColor systemOrangeColor];
              
              return [UISwipeActionsConfiguration configurationWithActions:@[deleteAction, disableAction]];
          }
          @end

          // --- Sources View Controller ---
          @interface SourcesViewController : UIViewController <UITableViewDataSource, UITableViewDelegate>
          @property (strong, nonatomic) UITableView *tableView;
          @property (strong, nonatomic) NSMutableArray *sourcesList;
          @end
          @implementation SourcesViewController
          - (void)viewDidLoad {
              [super viewDidLoad];
              self.view.backgroundColor = [UIColor colorWithRed:0.07 green:0.07 blue:0.09 alpha:1.0];
              CGFloat screenWidth = self.view.bounds.size.width;
              CGFloat screenHeight = self.view.bounds.size.height;
              
              UILabel *label = [[UILabel alloc] initWithFrame:CGRectMake(20, 70, screenWidth - 100, 40)];
              label.text = @"Sources";
              label.textColor = [UIColor whiteColor];
              label.font = [UIFont boldSystemFontOfSize:30];
              [self.view addSubview:label];
              
              UIButton *addSourceBtn = [UIButton buttonWithType:UIButtonTypeSystem];
              addSourceBtn.frame = CGRectMake(screenWidth - 60, 70, 40, 40);
              [addSourceBtn setTitle:@"+" forState:UIControlStateNormal];
              [addSourceBtn setTitleColor:[UIColor whiteColor] forState:UIControlStateNormal];
              addSourceBtn.titleLabel.font = [UIFont boldSystemFontOfSize:28];
              addSourceBtn.backgroundColor = [UIColor systemPurpleColor];
              addSourceBtn.layer.cornerRadius = 20;
              [addSourceBtn addTarget:self action:@selector(addSourcePrompt) forControlEvents:UIControlEventTouchUpInside];
              [self.view addSubview:addSourceBtn];
              
              self.sourcesList = [NSMutableArray arrayWithArray:@[
                  @"https://repo.vipe.store",
                  @"https://altstore.io/repo"
              ]];
              
              self.tableView = [[UITableView alloc] initWithFrame:CGRectMake(0, 130, screenWidth, screenHeight - 200) style:UITableViewStyleInsetGrouped];
              self.tableView.backgroundColor = [UIColor clearColor];
              self.tableView.dataSource = self;
              self.tableView.delegate = self;
              self.tableView.autoresizingMask = UIViewAutoresizingFlexibleWidth | UIViewAutoresizingFlexibleHeight;
              [self.view addSubview:self.tableView];
          }

          - (void)addSourcePrompt {
              UIAlertController *alert = [UIAlertController alertControllerWithTitle:@"Add Source" message:@"Enter repository JSON URL:" preferredStyle:UIAlertControllerStyleAlert];
              [alert addTextFieldWithConfigurationHandler:^(UITextField *textField) {
                  textField.placeholder = @"https://...";
                  textField.textColor = [UIColor whiteColor];
              }];
              [alert addAction:[UIAlertAction actionWithTitle:@"Cancel" style:UIAlertActionStyleCancel handler:nil]];
              [alert addAction:[UIAlertAction actionWithTitle:@"Add" style:UIAlertActionStyleDefault handler:^(UIAlertAction *action) {
                  NSString *url = alert.textFields.firstObject.text;
                  if (url.length > 0) {
                      [self.sourcesList addObject:url];
                      [self.tableView reloadData];
                  }
              }]];
              [self presentViewController:alert animated:YES completion:nil];
          }

          - (NSInteger)tableView:(UITableView *)tableView numberOfRowsInSection:(NSInteger)section {
              return self.sourcesList.count;
          }

          - (UITableViewCell *)tableView:(UITableView *)tableView cellForRowAtIndexPath:(NSIndexPath *)indexPath {
              UITableViewCell *cell = [tableView dequeueReusableCellWithIdentifier:@"SourceCell"];
              if (!cell) {
                  cell = [[UITableViewCell alloc] initWithStyle:UITableViewCellStyleDefault reuseIdentifier:@"SourceCell"];
              }
              cell.textLabel.text = self.sourcesList[indexPath.row];
              cell.textLabel.textColor = [UIColor whiteColor];
              cell.backgroundColor = [UIColor colorWithRed:0.12 green:0.12 blue:0.15 alpha:1.0];
              return cell;
          }
          @end

          // --- Account View Controller ---
          @interface AccountViewController : UIViewController
          @property (strong, nonatomic) UITextField *emailField;
          @property (strong, nonatomic) UITextField *passwordField;
          @end
          @implementation AccountViewController
          - (void)viewDidLoad {
              [super viewDidLoad];
              self.view.backgroundColor = [UIColor colorWithRed:0.07 green:0.07 blue:0.09 alpha:1.0];
              CGFloat screenWidth = self.view.bounds.size.width;
              
              UILabel *label = [[UILabel alloc] initWithFrame:CGRectMake(20, 70, screenWidth - 40, 40)];
              label.text = @"Apple ID Account";
              label.textColor = [UIColor whiteColor];
              label.font = [UIFont boldSystemFontOfSize:30];
              [self.view addSubview:label];
              
              UILabel *subLabel = [[UILabel alloc] initWithFrame:CGRectMake(20, 115, screenWidth - 40, 30)];
              subLabel.text = @"Link your Apple ID to sign apps locally.";
              subLabel.textColor = [UIColor grayColor];
              subLabel.font = [UIFont systemFontOfSize:14];
              [self.view addSubview:subLabel];
              
              self.emailField = [[UITextField alloc] initWithFrame:CGRectMake(20, 170, screenWidth - 40, 50)];
              self.emailField.placeholder = @"Apple ID Email";
              self.emailField.backgroundColor = [UIColor colorWithRed:0.12 green:0.12 blue:0.15 alpha:1.0];
              self.emailField.textColor = [UIColor whiteColor];
              self.emailField.layer.cornerRadius = 12;
              self.emailField.autoresizingMask = UIViewAutoresizingFlexibleWidth;
              self.emailField.leftView = [[UIView alloc] initWithFrame:CGRectMake(0, 0, 15, 50)];
              self.emailField.leftViewMode = UITextFieldViewModeAlways;
              [self.view addSubview:self.emailField];
              
              self.passwordField = [[UITextField alloc] initWithFrame:CGRectMake(20, 235, screenWidth - 40, 50)];
              self.passwordField.placeholder = @"App-Specific Password";
              self.passwordField.backgroundColor = [UIColor colorWithRed:0.12 green:0.12 blue:0.15 alpha:1.0];
              self.passwordField.textColor = [UIColor whiteColor];
              self.passwordField.secureTextEntry = YES;
              self.passwordField.layer.cornerRadius = 12;
              self.passwordField.autoresizingMask = UIViewAutoresizingFlexibleWidth;
              self.passwordField.leftView = [[UIView alloc] initWithFrame:CGRectMake(0, 0, 15, 50)];
              self.passwordField.leftViewMode = UITextFieldViewModeAlways;
              [self.view addSubview:self.passwordField];
              
              UIButton *loginBtn = [UIButton buttonWithType:UIButtonTypeSystem];
              loginBtn.frame = CGRectMake(20, 310, screenWidth - 40, 50);
              loginBtn.backgroundColor = [UIColor systemPurpleColor];
              [loginBtn setTitle:@"Sign In & Request 2FA" forState:UIControlStateNormal];
              [loginBtn setTitleColor:[UIColor whiteColor] forState:UIControlStateNormal];
              loginBtn.titleLabel.font = [UIFont boldSystemFontOfSize:17];
              loginBtn.layer.cornerRadius = 12;
              loginBtn.autoresizingMask = UIViewAutoresizingFlexibleWidth;
              [loginBtn addTarget:self action:@selector(request2FA) forControlEvents:UIControlEventTouchUpInside];
              [self.view addSubview:loginBtn];
          }

          - (void)request2FA {
              [self.view endEditing:YES];
              UIAlertController *twoFA = [UIAlertController alertControllerWithTitle:@"Two-Factor Authentication" message:@"Enter the 6-digit code sent to your trusted device:" preferredStyle:UIAlertControllerStyleAlert];
              [twoFA addTextFieldWithConfigurationHandler:^(UITextField *textField) {
                  textField.placeholder = @"123456";
                  textField.keyboardType = UIKeyboardTypeNumberPad;
                  textField.textColor = [UIColor whiteColor];
              }];
              [twoFA addAction:[UIAlertAction actionWithTitle:@"Verify" style:UIAlertActionStyleDefault handler:^(UIAlertAction *action) {
                  UIAlertController *success = [UIAlertController alertControllerWithTitle:@"Success" message:@"Apple ID authenticated & certificate generated!" preferredStyle:UIAlertControllerStyleAlert];
                  [success addAction:[UIAlertAction actionWithTitle:@"OK" style:UIAlertActionStyleDefault handler:nil]];
                  [self presentViewController:success animated:YES completion:nil];
              }]];
              [self presentViewController:twoFA animated:YES completion:nil];
          }
          @end

          // --- Settings View Controller ---
          @interface SettingsViewController : UIViewController <UITableViewDataSource, UITableViewDelegate>
          @property (strong, nonatomic) UITableView *tableView;
          @end
          @implementation SettingsViewController
          - (void)viewDidLoad {
              [super viewDidLoad];
              self.view.backgroundColor = [UIColor colorWithRed:0.07 green:0.07 blue:0.09 alpha:1.0];
              CGFloat screenWidth = self.view.bounds.size.width;
              CGFloat screenHeight = self.view.bounds.size.height;
              
              UILabel *label = [[UILabel alloc] initWithFrame:CGRectMake(20, 70, screenWidth - 40, 40)];
              label.text = @"Settings";
              label.textColor = [UIColor whiteColor];
              label.font = [UIFont boldSystemFontOfSize:30];
              [self.view addSubview:label];
              
              self.tableView = [[UITableView alloc] initWithFrame:CGRectMake(0, 130, screenWidth, screenHeight - 200) style:UITableViewStyleInsetGrouped];
              self.tableView.backgroundColor = [UIColor clearColor];
              self.tableView.dataSource = self;
              self.tableView.delegate = self;
              self.tableView.autoresizingMask = UIViewAutoresizingFlexibleWidth | UIViewAutoresizingFlexibleHeight;
              [self.view addSubview:self.tableView];
          }

          - (NSInteger)numberOfSectionsInTableView:(UITableView *)tableView {
              return 2;
          }

          - (NSInteger)tableView:(UITableView *)tableView numberOfRowsInSection:(NSInteger)section {
              return section == 0 ? 2 : 1;
          }

          - (UITableViewCell *)tableView:(UITableView *)tableView cellForRowAtIndexPath:(NSIndexPath *)indexPath {
              UITableViewCell *cell = [tableView dequeueReusableCellWithIdentifier:@"SettingCell"];
              if (!cell) {
                  cell = [[UITableViewCell alloc] initWithStyle:UITableViewCellStyleValue1 reuseIdentifier:@"SettingCell"];
              }
              cell.backgroundColor = [UIColor colorWithRed:0.12 green:0.12 blue:0.15 alpha:1.0];
              cell.textLabel.textColor = [UIColor whiteColor];
              cell.detailTextLabel.textColor = [UIColor grayColor];
              
              if (indexPath.section == 0) {
                  if (indexPath.row == 0) {
                      cell.textLabel.text = @"App Version";
                      cell.detailTextLabel.text = @"v3.1 Standalone";
                  } else {
                      cell.textLabel.text = @"Sideloading Engine";
                      cell.detailTextLabel.text = @"Native UIKit";
                  }
              } else {
                  cell.textLabel.text = @"Clear Cache / Reset";
                  cell.textLabel.textColor = [UIColor systemRedColor];
              }
              return cell;
          }
          @end

          // --- App Delegate ---
          @interface AppDelegate : UIResponder <UIApplicationDelegate>
          @property (strong, nonatomic) UIWindow *window;
          @end

          @implementation AppDelegate
          - (BOOL)application:(UIApplication *)application didFinishLaunchingWithOptions:(NSDictionary *)launchOptions {
              self.window = [[UIWindow alloc] initWithFrame:[[UIScreen mainScreen] bounds]];
              
              UITabBarController *tabBarController = [[UITabBarController alloc] init];
              
              HomeViewController *homeVC = [[HomeViewController alloc] init];
              homeVC.tabBarItem = [[UITabBarItem alloc] initWithTitle:@"Home" image:[UIImage systemImageNamed:@"house.fill"] tag:0];
              
              MyAppsViewController *myAppsVC = [[MyAppsViewController alloc] init];
              myAppsVC.tabBarItem = [[UITabBarItem alloc] initWithTitle:@"My Apps" image:[UIImage systemImageNamed:@"square.stack.fill"] tag:1];
              
              SourcesViewController *sourcesVC = [[SourcesViewController alloc] init];
              sourcesVC.tabBarItem = [[UITabBarItem alloc] initWithTitle:@"Sources" image:[UIImage systemImageNamed:@"globe"] tag:2];
              
              AccountViewController *accountVC = [[AccountViewController alloc] init];
              accountVC.tabBarItem = [[UITabBarItem alloc] initWithTitle:@"Account" image:[UIImage systemImageNamed:@"person.crop.circle.fill"] tag:3];
              
              SettingsViewController *settingsVC = [[SettingsViewController alloc] init];
              settingsVC.tabBarItem = [[UITabBarItem alloc] initWithTitle:@"Settings" image:[UIImage systemImageNamed:@"gearshape.fill"] tag:4];
              
              tabBarController.viewControllers = @[homeVC, myAppsVC, sourcesVC, accountVC, settingsVC];
              tabBarController.tabBar.tintColor = [UIColor systemPurpleColor];
              tabBarController.tabBar.unselectedItemTintColor = [UIColor grayColor];
              
              self.window.rootViewController = tabBarController;
              [self.window makeKeyAndVisible];
              return YES;
          }
          @end

          int main(int argc, char * argv[]) {
              @autoreleasepool {
                  return UIApplicationMain(argc, argv, nil, NSStringFromClass([AppDelegate class]));
              }
          }
          EOF

          xcrun -sdk iphoneos clang -arch arm64 -fobjc-arc main.m \
            -o Payload/VipeStore.app/VipeStore \
            -framework UIKit -framework Foundation -framework CoreGraphics

          chmod +x Payload/VipeStore.app/VipeStore

      - name: Create Info.plist & Package IPA
        run: |
          cat << 'EOF' > Payload/VipeStore.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleIdentifier</key>
              <string>com.vipe.store.app</string>
              <key>CFBundleName</key>
              <string>VipeStore</string>
              <key>CFBundleDisplayName</key>
              <string>VipeStore</string>
              <key>CFBundleExecutable</key>
              <string>VipeStore</string>
              <key>CFBundleVersion</key>
              <string>3.1</string>
              <key>CFBundleShortVersionString</key>
              <string>3.1</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>MinimumOSVersion</key>
              <string>15.0</string>
              <key>UIDeviceFamily</key>
              <array>
                  <integer>1</integer>
              </array>
              <key>UIRequiredDeviceCapabilities</key>
              <array>
                  <string>arm64</string>
              </array>
              <key>UILaunchStoryboardName</key>
              <string>LaunchScreen</string>
              <key>DTPlatformName</key>
              <string>iphoneos</string>
              <key>DTSDKName</key>
              <string>iphoneos</string>
          </dict>
          </plist>
          EOF

          cat << 'EOF' > Payload/VipeStore.app/LaunchScreen.storyboard
          <?xml version="1.0" encoding="UTF-8"?>
          <document type="com.apple.InterfaceBuilder3.CocoaTouch.Storyboard.XIB" version="3.00" toolsVersion="21507" targetRuntime="iOS.CocoaTouch" propertyAccessControl="none" useAutolayout="YES" launchScreen="YES" useTraitCollections="YES" useSafeAreas="YES" colorMatched="YES" initialViewController="01J-lp-oVM">
              <device id="retina6_1" orientation="portrait" appearance="dark"/>
              <scenes>
                  <scene sceneID="EHf-IW-A2E">
                      <objects>
                          <viewController id="01J-lp-oVM" sceneMemberID="ViewController">
                              <view key="view" contentMode="scaleToFill" id="Ze5-6b-2t3">
                                  <rect key="frame" x="0.0" y="0.0" width="414" height="896"/>
                                  <autoresizingMask key="autoresizingMask" widthSizable="YES" heightSizable="YES"/>
                                  <color key="backgroundColor" red="0.07" green="0.07" blue="0.09" alpha="1.0" colorSpace="custom" customColorSpace="sRGB"/>
                              </view>
                          </viewController>
                      </scenes>
                  </scene>
              </scenes>
          </document>
          </plist>
          EOF

          zip -r VipeStore.ipa Payload

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VipeStore-IPA
          path: VipeStore.ipa
