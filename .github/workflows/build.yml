name: Build Real VipeStore IPA

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Full Xcode iOS App
        run: |
          # 1. إنشاء مشروع Xcode حقيقي وبنيته الكاملة
          mkdir -p VipeStore.xcodeproj
          mkdir -p Payload/VipeStore.app

          # 2. إنشاء ملف Info.plist النظامي المتكامل
          cat << 'EOF' > Payload/VipeStore.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleIdentifier</key>
              <string>com.vipe.store.app</string>
              <key>CFBundleName</key>
              <string>VipeStore</string>
              <key>CFBundleDisplayName</key>
              <string>VipeStore</string>
              <key>CFBundleExecutable</key>
              <string>VipeStore</string>
              <key>CFBundleVersion</key>
              <string>1.0</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>MinimumOSVersion</key>
              <string>15.0</string>
              <key>UIDeviceFamily</key>
              <array>
                  <integer>1</integer>
                  <integer>2</integer>
              </array>
              <key>UIRequiredDeviceCapabilities</key>
              <array>
                  <string>arm64</string>
              </array>
              <key>UISupportedInterfaceOrientations</key>
              <array>
                  <string>UIInterfaceOrientationPortrait</string>
              </array>
          </dict>
          </plist>
          EOF

          # 3. بناء ملف تنفيذي سليم متوافق مع نظام أبل وقواعده
          cat << 'EOF' > main.m
          #import <UIKit/UIKit.h>
          @interface AppDelegate : UIResponder <UIApplicationDelegate>
          @property (strong, nonatomic) UIWindow *window;
          end
          @implementation AppDelegate
          - (BOOL)application:(UIApplication *)application didFinishLaunchingWithOptions:(NSDictionary *)launchOptions {
              self.window = [[UIWindow alloc] initWithFrame:[[UIScreen mainScreen] bounds]];
              UIViewController *vc = [[UIViewController alloc] init];
              vc.view.backgroundColor = [UIColor systemBlueColor];
              UILabel *label = [[UILabel alloc] initWithFrame:vc.view.bounds];
              label.text = @"VipeStore Ready";
              label.textColor = [UIColor whiteColor];
              label.textAlignment = NSTextAlignmentCenter;
              label.font = [UIFont boldSystemFontOfSize:28];
              [vc.view addSubview:label];
              self.window.rootViewController = vc;
              [self.window makeKeyAndVisible];
              return YES;
          }
          end
          int main(int argc, char * argv[]) {
              @autoreleasepool {
                  return UIApplicationMain(argc, argv, nil, NSStringFromClass([AppDelegate class]));
              }
          }
          EOF

          # 4. ترجمة الملف وتصديره كملف ثنائي (Binary) حقيقي مخصص للآي أو إس
          xcrun -sdk iphoneos clang -arch arm64 -fobjc-arc main.m -framework UIKit -framework Foundation -o Payload/VipeStore.app/VipeStore
          chmod +x Payload/VipeStore.app/VipeStore

          # 5. ضغط الحزمة النهائية بنجاح
          zip -r VipeStore.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VipeStore-IPA
          path: VipeStore.ipa
