name: Build VipeStore Swift Project

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Compile and Package IPA
        run: |
          set -e
          rm -rf Payload VipeStore.ipa
          mkdir -p Payload/VipeStore.app
          
          cat << 'EOF' > main_complete.m
          #import <UIKit/UIKit.h>

          @interface PersistenceManager : NSObject
          + (void)saveSources:(NSArray *)sources;
          + (NSMutableArray *)loadSources;
          + (void)saveInstalledApps:(NSArray *)apps;
          + (NSMutableArray *)loadInstalledApps;
          + (void)addInstalledApp:(NSDictionary *)app;
          @end

          @implementation PersistenceManager
          + (void)saveSources:(NSArray *)sources {
              [[NSUserDefaults standardUserDefaults] setObject:sources forKey:@"VipeStore_Sources"];
              [[NSUserDefaults standardUserDefaults] synchronize];
          }

          + (NSMutableArray *)loadSources {
              NSArray *saved = [[NSUserDefaults standardUserDefaults] arrayForKey:@"VipeStore_Sources"];
              if (!saved) {
                  return [NSMutableArray arrayWithArray:@[@"https://apps.altstore.io"]];
              }
              return [saved mutableCopy];
          }

          + (void)saveInstalledApps:(NSArray *)apps {
              [[NSUserDefaults standardUserDefaults] setObject:apps forKey:@"VipeStore_InstalledApps"];
              [[NSUserDefaults standardUserDefaults] synchronize];
          }

          + (NSMutableArray *)loadInstalledApps {
              NSArray *saved = [[NSUserDefaults standardUserDefaults] arrayForKey:@"VipeStore_InstalledApps"];
              if (!saved) {
                  return [NSMutableArray arrayWithArray:@[]];
              }
              return [saved mutableCopy];
          }

          + (void)addInstalledApp:(NSDictionary *)app {
              NSMutableArray *apps = [self loadInstalledApps];
              [apps addObject:app];
              [self saveInstalledApps:apps];
          }
          @end

          @interface HomeViewController : UIViewController
          @end
          @implementation HomeViewController
          - (void)viewDidLoad {
              [super viewDidLoad];
              self.view.backgroundColor = [UIColor colorWithRed:0.07 green:0.07 blue:0.09 alpha:1.0];
              self.title = @"Home";
              
              UILabel *titleLabel = [[UILabel alloc] initWithFrame:CGRectMake(20, 100, self.view.bounds.size.width - 40, 40)];
              titleLabel.text = @"Welcome to VipeStore 🚀";
              titleLabel.textColor = [UIColor whiteColor];
              titleLabel.font = [UIFont boldSystemFontOfSize:24];
              [self.view addSubview:titleLabel];
              
              UILabel *subLabel = [[UILabel alloc] initWithFrame:CGRectMake(20, 150, self.view.bounds.size.width - 40, 60)];
              subLabel.text = @"Your ultimate iOS sideloading & repository hub.";
              subLabel.textColor = [UIColor lightGrayColor];
              subLabel.font = [UIFont systemFontOfSize:15];
              subLabel.numberOfLines = 0;
              [self.view addSubview:subLabel];
          }
          @end

          // --- Source Detail View Controller (True JSON Parser & Working GET Button) ---
          @interface SourceDetailViewController : UIViewController <UITableViewDataSource, UITableViewDelegate>
          @property (strong, nonatomic) NSString *sourceURL;
          @property (strong, nonatomic) NSMutableArray *repoApps;
          @property (strong, nonatomic) UIActivityIndicatorView *spinner;
          @end

          @implementation SourceDetailViewController
          - (void)viewDidLoad {
              [super viewDidLoad];
              self.view.backgroundColor = [UIColor colorWithRed:0.07 green:0.07 blue:0.09 alpha:1.0];
              self.title = @"Repository Apps";
              self.repoApps = [NSMutableArray array];

              self.spinner = [[UIActivityIndicatorView alloc] initWithActivityIndicatorStyle:UIActivityIndicatorViewStyleMedium];
              self.spinner.center = self.view.center;
              self.spinner.color = [UIColor whiteColor];
              [self.view addSubview:self.spinner];

              UITableView *tableView = [[UITableView alloc] initWithFrame:self.view.bounds style:UITableViewStyleInsetGrouped];
              tableView.backgroundColor = [UIColor clearColor];
              tableView.dataSource = self;
              tableView.delegate = self;
              tableView.tag = 101;
              [self.view addSubview:tableView];

              [self fetchLiveSourceData];
          }

          - (void)fetchLiveSourceData {
              [self.spinner startAnimating];
              NSURL *url = [NSURL URLWithString:self.sourceURL];
              if (!url) {
                  [self.spinner stopAnimating];
                  return;
              }

              NSURLSessionDataTask *task = [[NSURLSession sharedSession] dataTaskWithURL:url completionHandler:^(NSData *data, NSURLResponse *response, NSError *error) {
                  dispatch_async(dispatch_get_main_queue(), ^{
                      [self.spinner stopAnimating];
                      if (data && !error) {
                          NSError *jsonError = nil;
                          NSDictionary *json = [NSJSONSerialization JSONObjectWithData:data options:0 error:&jsonError];
                          if (!jsonError && [json isKindOfClass:[NSDictionary class]]) {
                              NSArray *apps = json[@"apps"];
                              [self.repoApps removeAllObjects];
                              if (apps && [apps isKindOfClass:[NSArray class]]) {
                                  for (NSDictionary *app in apps) {
                                      NSString *name = app[@"name"] ? app[@"name"] : @"Unknown App";
                                      NSString *version = app[@"version"] ? app[@"version"] : @"1.0";
                                      NSString *desc = app[@"localizedDescription"] ? app[@"localizedDescription"] : (app[@"subtitle"] ? app[@"subtitle"] : @"No description");
                                      [self.repoApps addObject:@{@"name": name, @"version": version, @"desc": desc}];
                                  }
                              }
                              UITableView *tv = (UITableView *)[self.view viewWithTag:101];
                              [tv reloadData];
                          }
                      }
                  });
              }];
              [task resume];
          }

          - (NSInteger)tableView:(UITableView *)tableView numberOfRowsInSection:(NSInteger)section {
              return self.repoApps.count;
          }

          - (UITableViewCell *)tableView:(UITableView *)tableView cellForRowAtIndexPath:(NSIndexPath *)indexPath {
              UITableViewCell *cell = [tableView dequeueReusableCellWithIdentifier:@"RepoCell"];
              if (!cell) {
                  cell = [[UITableViewCell alloc] initWithStyle:UITableViewCellStyleSubtitle reuseIdentifier:@"RepoCell"];
              }
              if (indexPath.row < self.repoApps.count) {
                  NSDictionary *app = self.repoApps[indexPath.row];
                  cell.textLabel.text = app[@"name"];
                  cell.textLabel.textColor = [UIColor whiteColor];
                  cell.detailTextLabel.text = [NSString stringWithFormat:@"%@ • %@", app[@"version"], app[@"desc"]];
                  cell.detailTextLabel.textColor = [UIColor lightGrayColor];
              }
              cell.backgroundColor = [UIColor colorWithRed:0.12 green:0.12 blue:0.15 alpha:1.0];

              UIButton *getBtn = [UIButton buttonWithType:UIButtonTypeSystem];
              getBtn.frame = CGRectMake(0, 0, 60, 30);
              getBtn.backgroundColor = [UIColor systemPurpleColor];
              [getBtn setTitle:@"GET" forState:UIControlStateNormal];
              [getBtn setTitleColor:[UIColor whiteColor] forState:UIControlStateNormal];
              getBtn.titleLabel.font = [UIFont boldSystemFontOfSize:13];
              getBtn.layer.cornerRadius = 15;
              getBtn.tag = indexPath.row;
              [getBtn removeTarget:nil action:NULL forControlEvents:UIControlEventAllEvents];
              [getBtn addTarget:self action:@selector(installApp:) forControlEvents:UIControlEventTouchUpInside];
              cell.accessoryView = getBtn;

              return cell;
          }

          - (void)installApp:(UIButton *)sender {
              NSInteger index = sender.tag;
              if (index < self.repoApps.count) {
                  NSDictionary *app = self.repoApps[index];
                  [PersistenceManager addInstalledApp:app];
                  
                  UIAlertController *alert = [UIAlertController alertControllerWithTitle:@"Success" message:[NSString stringWithFormat:@"'%@' added to My Apps!", app[@"name"]] preferredStyle:UIAlertControllerStyleAlert];
                  [alert addAction:[UIAlertAction actionWithTitle:@"OK" style:UIAlertActionStyleDefault handler:nil]];
                  [self presentViewController:alert animated:YES completion:nil];
              }
          }
          @end

          // --- My Apps View Controller (With Add Button +) ---
          @interface MyAppsViewController : UIViewController <UITableViewDataSource, UITableViewDelegate>
          @property (strong, nonatomic) UITableView *tableView;
          @property (strong, nonatomic) NSMutableArray *installedApps;
          @end
          @implementation MyAppsViewController
          - (void)viewDidLoad {
              [super viewDidLoad];
              self.view.backgroundColor = [UIColor colorWithRed:0.07 green:0.07 blue:0.09 alpha:1.0];
              self.title = @"My Apps";
              
              self.installedApps = [PersistenceManager loadInstalledApps];
              
              self.tableView = [[UITableView alloc] initWithFrame:self.view.bounds style:UITableViewStyleInsetGrouped];
              self.tableView.backgroundColor = [UIColor clearColor];
              self.tableView.dataSource = self;
              self.tableView.delegate = self;
              [self.view addSubview:self.tableView];
              
              UIBarButtonItem *addBtn = [[UIBarButtonItem alloc] initWithBarButtonSystemItem:UIBarButtonSystemItemAdd target:self action:@selector(addAppPrompt)];
              self.navigationItem.rightBarButtonItem = addBtn;
          }

          - (void)viewWillAppear:(BOOL)animated {
              [super viewWillAppear:animated];
              self.installedApps = [PersistenceManager loadInstalledApps];
              [self.tableView reloadData];
          }

          - (void)addAppPrompt {
              UIAlertController *alert = [UIAlertController alertControllerWithTitle:@"Add Custom App" message:@"Enter app details:" preferredStyle:UIAlertControllerStyleAlert];
              [alert addTextFieldWithConfigurationHandler:^(UITextField *tf) { tf.placeholder = @"App Name"; tf.textColor = [UIColor whiteColor]; }];
              [alert addTextFieldWithConfigurationHandler:^(UITextField *tf) { tf.placeholder = @"Version (e.g. 1.0)"; tf.textColor = [UIColor whiteColor]; }];
              [alert addAction:[UIAlertAction actionWithTitle:@"Cancel" style:UIAlertActionStyleCancel handler:nil]];
              [alert addAction:[UIAlertAction actionWithTitle:@"Add" style:UIAlertActionStyleDefault handler:^(UIAlertAction *action) {
                  NSString *name = alert.textFields[0].text;
                  NSString *version = alert.textFields[1].text;
                  if (name.length > 0) {
                      NSDictionary *newApp = @{@"name": name, @"version": version.length > 0 ? version : @"1.0", @"desc": @"Custom sideloaded app"};
                      [PersistenceManager addInstalledApp:newApp];
                      self.installedApps = [PersistenceManager loadInstalledApps];
                      [self.tableView reloadData];
                  }
              }]];
              [self presentViewController:alert animated:YES completion:nil];
          }

          - (NSInteger)tableView:(UITableView *)tableView numberOfRowsInSection:(NSInteger)section {
              return self.installedApps.count > 0 ? self.installedApps.count : 1;
          }

          - (UITableViewCell *)tableView:(UITableView *)tableView cellForRowAtIndexPath:(NSIndexPath *)indexPath {
              UITableViewCell *cell = [tableView dequeueReusableCellWithIdentifier:@"AppCell"];
              if (!cell) {
                  cell = [[UITableViewCell alloc] initWithStyle:UITableViewCellStyleSubtitle reuseIdentifier:@"AppCell"];
              }
              cell.backgroundColor = [UIColor colorWithRed:0.12 green:0.12 blue:0.15 alpha:1.0];
              if (self.installedApps.count > 0) {
                  cell.textLabel.text = self.installedApps[indexPath.row][@"name"];
                  cell.textLabel.textColor = [UIColor whiteColor];
                  cell.detailTextLabel.text = self.installedApps[indexPath.row][@"version"] ? [NSString stringWithFormat:@"Version: %@", self.installedApps[indexPath.row][@"version"]] : @"Installed";
                  cell.detailTextLabel.textColor = [UIColor systemGreenColor];
              } else {
                  cell.textLabel.text = @"No apps installed yet";
                  cell.textLabel.textColor = [UIColor lightGrayColor];
                  cell.detailTextLabel.text = @"Use Sources or click '+' to add apps";
                  cell.detailTextLabel.textColor = [UIColor grayColor];
              }
              return cell;
          }
          @end

          @interface SourcesViewController : UIViewController <UITableViewDataSource, UITableViewDelegate>
          @property (strong, nonatomic) UITableView *tableView;
          @property (strong, nonatomic) NSMutableArray *sourcesList;
          @end

          @implementation SourcesViewController
          - (void)viewDidLoad {
              [super viewDidLoad];
              self.view.backgroundColor = [UIColor colorWithRed:0.07 green:0.07 blue:0.09 alpha:1.0];
              self.title = @"Sources";
              
              self.sourcesList = [PersistenceManager loadSources];
              
              self.tableView = [[UITableView alloc] initWithFrame:self.view.bounds style:UITableViewStyleInsetGrouped];
              self.tableView.backgroundColor = [UIColor clearColor];
              self.tableView.dataSource = self;
              self.tableView.delegate = self;
              [self.view addSubview:self.tableView];
              
              UIBarButtonItem *addBtn = [[UIBarButtonItem alloc] initWithBarButtonSystemItem:UIBarButtonSystemItemAdd target:self action:@selector(addSourcePrompt)];
              self.navigationItem.rightBarButtonItem = addBtn;
          }

          - (void)addSourcePrompt {
              UIAlertController *alert = [UIAlertController alertControllerWithTitle:@"Add Source JSON" message:@"Enter repository URL:" preferredStyle:UIAlertControllerStyleAlert];
              [alert addTextFieldWithConfigurationHandler:^(UITextField *textField) {
                  textField.placeholder = @"https://...";
                  textField.textColor = [UIColor whiteColor];
              }];
              [alert addAction:[UIAlertAction actionWithTitle:@"Cancel" style:UIAlertActionStyleCancel handler:nil]];
              [alert addAction:[UIAlertAction actionWithTitle:@"Add" style:UIAlertActionStyleDefault handler:^(UIAlertAction *action) {
                  NSString *url = alert.textFields.firstObject.text;
                  if (url.length > 0) {
                      [self.sourcesList addObject:url];
                      [PersistenceManager saveSources:self.sourcesList];
                      [self.tableView reloadData];
                  }
              }]];
              [self presentViewController:alert animated:YES completion:nil];
          }

          - (NSInteger)tableView:(UITableView *)tableView numberOfRowsInSection:(NSInteger)section {
              return self.sourcesList.count;
          }

          - (UITableViewCell *)tableView:(UITableView *)tableView cellForRowAtIndexPath:(NSIndexPath *)indexPath {
              UITableViewCell *cell = [tableView dequeueReusableCellWithIdentifier:@"SourceCell"];
              if (!cell) {
                  cell = [[UITableViewCell alloc] initWithStyle:UITableViewCellStyleDefault reuseIdentifier:@"SourceCell"];
              }
              cell.textLabel.text = self.sourcesList[indexPath.row];
              cell.textLabel.textColor = [UIColor whiteColor];
              cell.backgroundColor = [UIColor colorWithRed:0.12 green:0.12 blue:0.15 alpha:1.0];
              cell.accessoryType = UITableViewCellAccessoryDisclosureIndicator;
              return cell;
          }

          - (void)tableView:(UITableView *)tableView didSelectRowAtIndexPath:(NSIndexPath *)indexPath {
              [tableView deselectRowAtIndexPath:indexPath animated:YES];
              SourceDetailViewController *detailVC = [[SourceDetailViewController alloc] init];
              detailVC.sourceURL = self.sourcesList[indexPath.row];
              [self.navigationController pushViewController:detailVC animated:YES];
          }
          @end

          @interface AccountViewController : UIViewController <UITableViewDataSource, UITableViewDelegate>
          @property (strong, nonatomic) UITableView *tableView;
          @end
          @implementation AccountViewController
          - (void)viewDidLoad {
              [super viewDidLoad];
              self.view.backgroundColor = [UIColor colorWithRed:0.07 green:0.07 blue:0.09 alpha:1.0];
              self.title = @"Account & Pairing";
              
              self.tableView = [[UITableView alloc] initWithFrame:self.view.bounds style:UITableViewStyleInsetGrouped];
              self.tableView.backgroundColor = [UIColor clearColor];
              self.tableView.dataSource = self;
              self.tableView.delegate = self;
              [self.view addSubview:self.tableView];
          }
          - (NSInteger)numberOfSectionsInTableView:(UITableView *)tableView { return 2; }
          - (NSInteger)tableView:(UITableView *)tableView numberOfRowsInSection:(NSInteger)section { return 1; }
          - (NSString *)tableView:(UITableView *)tableView titleForHeaderInSection:(NSInteger)section {
              return section == 0 ? @"Pairing File Setup" : @"Developer Account";
          }
          - (UITableViewCell *)tableView:(UITableView *)tableView cellForRowAtIndexPath:(NSIndexPath *)indexPath {
              UITableViewCell *cell = [[UITableViewCell alloc] initWithStyle:UITableViewCellStyleDefault reuseIdentifier:@"AccCell"];
              cell.backgroundColor = [UIColor colorWithRed:0.12 green:0.12 blue:0.15 alpha:1.0];
              cell.textLabel.textColor = [UIColor whiteColor];
              if (indexPath.section == 0) {
                  cell.textLabel.text = @"📁 Pairing File Status: Ready";
                  cell.textLabel.textColor = [UIColor systemPurpleColor];
              } else {
                  cell.textLabel.text = @"🔑 Developer Sign-in Active";
              }
              return cell;
          }
          @end

          @interface SettingsViewController : UITableViewController
          @end
          @implementation SettingsViewController
          - (void)viewDidLoad {
              [super viewDidLoad];
              self.view.backgroundColor = [UIColor colorWithRed:0.07 green:0.07 blue:0.09 alpha:1.0];
              self.title = @"Settings";
              self.tableView = [[UITableView alloc] initWithFrame:self.view.bounds style:UITableViewStyleInsetGrouped];
              self.tableView.backgroundColor = [UIColor clearColor];
          }
          - (NSInteger)numberOfSectionsInTableView:(UITableView *)tableView { return 1; }
          - (NSInteger)tableView:(UITableView *)tableView numberOfRowsInSection:(NSInteger)section { return 3; }
          - (UITableViewCell *)tableView:(UITableView *)tableView cellForRowAtIndexPath:(NSIndexPath *)indexPath {
              UITableViewCell *cell = [[UITableViewCell alloc] initWithStyle:UITableViewCellStyleDefault reuseIdentifier:@"SetCell"];
              cell.backgroundColor = [UIColor colorWithRed:0.12 green:0.12 blue:0.15 alpha:1.0];
              cell.textLabel.textColor = [UIColor whiteColor];
              if (indexPath.row == 0) cell.textLabel.text = @"LocalDevVPN Status: Active";
              if (indexPath.row == 1) cell.textLabel.text = @"Clear App Cache";
              if (indexPath.row == 2) cell.textLabel.text = @"VipeStore Version 7.3 (Pro)";
              return cell;
          }
          @end

          @interface AppDelegate : UIResponder <UIApplicationDelegate>
          @property (strong, nonatomic) UIWindow *window;
          @end

          @implementation AppDelegate
          - (BOOL)application:(UIApplication *)application didFinishLaunchingWithOptions:(NSDictionary *)launchOptions {
              self.window = [[UIWindow alloc] initWithFrame:[[UIScreen mainScreen] bounds]];
              
              UITabBarController *tabBarController = [[UITabBarController alloc] init];
              
              if (@available(iOS 15.0, *)) {
                  UITabBarAppearance *appearance = [[UITabBarAppearance alloc] init];
                  [appearance configureWithOpaqueBackground];
                  appearance.backgroundColor = [UIColor colorWithRed:0.09 green:0.09 blue:0.12 alpha:0.95];
                  tabBarController.tabBar.standardAppearance = appearance;
                  tabBarController.tabBar.scrollEdgeAppearance = appearance;
              }
              tabBarController.tabBar.tintColor = [UIColor systemPurpleColor];
              
              HomeViewController *homeVC = [[HomeViewController alloc] init];
              UINavigationController *homeNav = [[UINavigationController alloc] initWithRootViewController:homeVC];
              homeNav.tabBarItem = [[UITabBarItem alloc] initWithTitle:@"Home" image:[UIImage systemImageNamed:@"house.fill"] tag:0];
              
              MyAppsViewController *myAppsVC = [[MyAppsViewController alloc] init];
              UINavigationController *myAppsNav = [[UINavigationController alloc] initWithRootViewController:myAppsVC];
              myAppsNav.tabBarItem = [[UITabBarItem alloc] initWithTitle:@"Apps" image:[UIImage systemImageNamed:@"square.stack.3d.down.right.fill"] tag:1];
              
              SourcesViewController *sourcesVC = [[SourcesViewController alloc] init];
              UINavigationController *sourcesNav = [[UINavigationController alloc] initWithRootViewController:sourcesVC];
              sourcesNav.tabBarItem = [[UITabBarItem alloc] initWithTitle:@"Sources" image:[UIImage systemImageNamed:@"globe"] tag:2];
              
              AccountViewController *accountVC = [[AccountViewController alloc] init];
              UINavigationController *accountNav = [[UINavigationController alloc] initWithRootViewController:accountVC];
              accountNav.tabBarItem = [[UITabBarItem alloc] initWithTitle:@"Account" image:[UIImage systemImageNamed:@"person.crop.circle.fill"] tag:3];
              
              SettingsViewController *settingsVC = [[SettingsViewController alloc] init];
              UINavigationController *settingsNav = [[UINavigationController alloc] initWithRootViewController:settingsVC];
              settingsNav.tabBarItem = [[UITabBarItem alloc] initWithTitle:@"Settings" image:[UIImage systemImageNamed:@"gearshape.fill"] tag:4];
              
              tabBarController.viewControllers = @[homeNav, myAppsNav, sourcesNav, accountNav, settingsNav];
              
              self.window.rootViewController = tabBarController;
              [self.window makeKeyAndVisible];
              return YES;
          }
          @end

          int main(int argc, char * argv[]) {
              @autoreleasepool {
                  return UIApplicationMain(argc, argv, nil, NSStringFromClass([AppDelegate class]));
              }
          }
          EOF

          xcrun -sdk iphoneos clang -arch arm64 -fobjc-arc main_complete.m \
            -o Payload/VipeStore.app/VipeStore \
            -framework UIKit -framework Foundation -framework CoreGraphics

          chmod +x Payload/VipeStore.app/VipeStore
          rm -f main_complete.m

          cat << 'EOF' > Payload/VipeStore.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleIdentifier</key>
              <string>com.vipe.store.app</string>
              <key>CFBundleName</key>
              <string>VipeStore</string>
              <key>CFBundleDisplayName</key>
              <string>VipeStore</string>
              <key>CFBundleExecutable</key>
              <string>VipeStore</string>
              <key>CFBundleVersion</key>
              <string>7.3</string>
              <key>CFBundleShortVersionString</key>
              <string>7.3</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>MinimumOSVersion</key>
              <string>15.0</string>
              <key>UIDeviceFamily</key>
              <array>
                  <integer>1</integer>
              </array>
          </dict>
          </plist>
          EOF

          zip -r VipeStore.ipa Payload

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VipeStore-IPA
          path: VipeStore.ipa
