name: Build Real VipeStore IPA

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Mach-O iOS App
        run: |
          # 1. إنشاء هيكل التطبيق بالاسم الصحيح
          mkdir -p Payload/VipeStore.app

          # 2. إنشاء كود C سليم ونظيف
          cat << 'EOF' > main.c
          #include <stdio.h>
          int main() {
              printf("VipeStore Mach-O Initialized Successfully\n");
              return 0;
          }
          EOF

          # 3. السر هنا: ترجمة الكود حصرياً لنظام iOS الحقيقي وليس الـ macOS
          xcrun -sdk iphoneos clang -arch arm64 main.c -o Payload/VipeStore.app/VipeStore
          chmod +x Payload/VipeStore.app/VipeStore

          # 4. إنشاء ملف Info.plist متوافق تماماً وموجه لنظام iOS
          cat << 'EOF' > Payload/VipeStore.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleIdentifier</key>
              <string>com.vipe.store.app</string>
              <key>CFBundleName</key>
              <string>VipeStore</string>
              <key>CFBundleDisplayName</key>
              <string>VipeStore</string>
              <key>CFBundleExecutable</key>
              <string>VipeStore</string>
              <key>CFBundleVersion</key>
              <string>8.0</string>
              <key>CFBundleShortVersionString</key>
              <string>8.0</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>MinimumOSVersion</key>
              <string>17.0</string>
              <key>UIDeviceFamily</key>
              <array>
                  <integer>1</integer>
              </array>
              <key>UIRequiredDeviceCapabilities</key>
              <array>
                  <string>arm64</string>
              </array>
              <key>DTPlatformName</key>
              <string>iphoneos</string>
              <key>DTSDKName</key>
              <string>iphoneos</string>
          </dict>
          </plist>
          EOF

          # 5. ضغط الحزمة إلى IPA نهائي
          zip -r VipeStore.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VipeStore-IPA
          path: VipeStore.ipa
